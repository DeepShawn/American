<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不被封的一天</title>
<meta name="description" content="回合制生存 / 策略解谜 / 黑色幽默：在判官眼皮底下用完今天的 Claude 对话额度，并且号还活着。">
<style>
:root {
  --bg: #f4f1ea;
  --panel: #ffffff;
  --ink: #1f1d1a;
  --muted: #6e685f;
  --line: #e0dacd;
  --accent: #c2603f;
  --accent-ink: #ffffff;
  --danger: #a8322a;
  --ok: #2f7a4e;
  --me: #ebe4d6;
  --sys: #f8efe3;
  --chip: #f1ece2;
  --chip-on: #1f1d1a;
  --chip-on-ink: #f4f1ea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1917;
    --panel: #242220;
    --ink: #ece7de;
    --muted: #a39c90;
    --line: #3a3631;
    --accent: #d9774f;
    --me: #322e29;
    --sys: #2d2620;
    --chip: #2e2b27;
    --chip-on: #ece7de;
    --chip-on-ink: #1a1917;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1917; --panel: #242220; --ink: #ece7de; --muted: #a39c90; --line: #3a3631;
  --accent: #d9774f; --me: #322e29; --sys: #2d2620; --chip: #2e2b27; --chip-on: #ece7de; --chip-on-ink: #1a1917;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  min-height: 100vh;
}
#app { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 30px; line-height: 1.25; margin: 8px 0 4px; letter-spacing: .02em; }
h2 { font-size: 20px; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); font-weight: 600; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 14px 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 10px; padding: 10px 16px; font: inherit; cursor: pointer; margin: 4px 6px 4px 0;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.link { border: none; background: none; color: var(--accent); padding: 4px 0; text-decoration: underline; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.field { margin: 12px 0; }
.field > label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px;
  padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.chat { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.msg { padding: 10px 14px; border-radius: 14px; max-width: 92%; white-space: pre-wrap; word-break: break-word; }
.msg.me { align-self: flex-end; background: var(--me); }
.msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.msg.ai .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.msg.sys { align-self: center; background: var(--sys); color: var(--muted); font-size: 13px; border-radius: 8px; max-width: 100%; }
.msg.sys b { color: var(--danger); font-weight: 600; }
.msg.sys b.up { color: var(--ok); }
.bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.mail { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; white-space: pre-wrap; line-height: 1.7; }
.mail .sig { color: var(--muted); }
.odds { display: grid; grid-template-columns: 7.5em 1fr 3em; gap: 6px 10px; align-items: center; font-size: 13px; }
.odds .bar > i { background: var(--muted); }
.odds .bar.hi > i { background: var(--danger); }
.rules li { margin: 4px 0; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9;
}
.toast.show { opacity: 1; }
.preview { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.ad { border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--muted); margin: 14px 0; }
.big { font-size: 22px; font-weight: 600; line-height: 1.5; }
.ach { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); margin: 3px 4px 3px 0; }
.ach.off { opacity: .4; }
.group .msg { max-width: 100%; }
.group .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.event { border-color: var(--accent); }
.event .opts .btn { display: block; width: 100%; text-align: left; margin: 8px 0 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-size: 20px; }
.quiz .chip.ok { outline: 2px solid var(--ok); }
.quiz .chip.miss { outline: 2px dashed var(--danger); }
.mark { font-size: 12px; margin-left: 4px; }
select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 100%; }
</style>
</head>

    zh: '帮我给房东写封邮件说暖气坏了',

    replies: [

    ],
  },

    replies: [
      '问题在第 7 行：当数组为空时，你没有 return 任何东西。加一个默认返回值即可。',

  },

// 互助群发言人：越老越靠谱，但也不总是对。
const SOURCES = {
  veteran: ['老哥（存活 213 天）', '元老（存活 401 天）', '群主（存活 365 天）'],
  newbie:  ['萌新（存活 0 天）', '刚进群的（存活 2 小时）', '路人甲（存活 3 天）'],
  shot:    ['截图哥（来源不明）', '转发的（据说是内部消息）'],
};
const GROUP_NOISE = [
  '有人用过“另一个选项”吗，好用吗',
  '我又注册了一个，这是第 14 个',
  '群里还剩几个活人？扣 1',
  '建议大家统一改名叫 John',
  '今天判官好像心情不错',
  '我觉得规则每天都在变（发言者已被封）',
];

/* ======================================================================
 * 存档（仅本浏览器；读写失败也能玩）
 * ====================================================================== */

const SAVE_KEY = 'bubeifeng-v2';
function loadSave() {
  const empty = { day: 0, failStreak: 0, wins: 0, fails: 0, best: 0, accounts: 0, ach: [], account: null };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? Object.assign(empty, JSON.parse(raw)) : empty;
  } catch (e) { return empty; }
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 无痕模式等 */ }
}
const save = loadSave();

/* ======================================================================
 * 工具
 * ====================================================================== */

const $app = document.getElementById('app');
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let toastTimer;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function unlock(id) {
  if (!save.ach.includes(id)) {
    save.ach.push(id);
    persist();
    toast('成就解锁：' + ACHIEVEMENTS[id]);
  }
}

// 一组单选 chip。defaultIndex 为 'random' 时每天随机预选，逼玩家自己判断。
function chipRows(fields, current, defaultIndex) {
  return fields.map(([key, label, opts]) => {
    const d = current && current[key] != null ? opts.findIndex(o => o[0] === current[key])
      : defaultIndex === 'random' ? rand(0, opts.length - 1) : 0;
    return `<div class="field"><label>${label}</label><div class="row" data-key="${key}">
      ${opts.map(([v, t], i) => `<button class="chip" data-v="${v}" aria-pressed="${i === d}">${t}</button>`).join('')}
    </div></div>`;
  }).join('');
}
function bindChips(root, onChange) {
  root.querySelectorAll('.row[data-key]').forEach(row => {
    row.querySelectorAll('.chip').forEach(chip => {
      chip.onclick = () => {
        row.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
        chip.setAttribute('aria-pressed', 'true');
        if (onChange) onChange(row.dataset.key, chip.dataset.v);
      };
    });
  });
}
function readChips(root) {
  const out = {};
  root.querySelectorAll('.row[data-key]').forEach(row => {
    const on = row.querySelector('.chip[aria-pressed="true"]');
    out[row.dataset.key] = on ? on.dataset.v : null;
  });
  return out;
}
const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

/* ======================================================================
 * 账号（跨天延续）与一天的状态
 * ====================================================================== */

function newAccount() {
  save.accounts += 1;
  save.account = {
    name: pick(['john', 'mike', 'emily', 'david', 'sarah']) + '.' + pick(['smith', 'miller', 'brown', 'lee']) + rand(1970, 2005) + '@example.com',
    age: 0,      // 存活天数
    heat: 0,     // 判官的“印象”，0–60，会扣在第二天的初始伪装值上
    appeals: 0,  // 这个号用过几次申诉
  };
  persist();
}
const acct = () => save.account;

function heatLabel(h) {
  if (h < 8) return '模糊';
  if (h < 20) return '有点印象';
  if (h < 35) return '记住你了';
  return '正在看着你';
}

let S;
function newDay() {
  if (!acct()) newAccount();
  save.day += 1;
  persist();
  const age = acct().age;
  const ruleCount = age < 2 ? 3 : age < 5 ? 4 : 5;
  S = {
    cover: 100 - acct().heat,
    rules: new Set(shuffle(RULE_IDS).slice(0, ruleCount)),
    probed: new Set(),
    log: [],             // {kind:'me'|'ai'|'sys', text, delta?}
    task: null,
    quota: 4, used: 0,
    need: 4 + Math.min(2, Math.floor(age / 3)),
    progress: 0,
    round: 0,
    performed: 0,
    events: 0, seenEvents: new Set(), pending: null,
    strict: age >= 6 ? 1.3 : 1,
    policyFired: false, prebanFired: false,
    heatAdd: 0,
    banReason: '', appealTries: 3, appealBonus: 0, appealed: false,
    picks: { lang: pick(['en', 'mix']), punct: pick(['half', 'full', 'tilde']), tone: pick(['direct', 'polite']), len: 'short', how: pick(['hand', 'paste']) },
  };
}
const has = r => S.rules.has(r);

// 判官默默扣分，不告诉玩家扣了什么、扣了多少；最后一条理由只写进封号邮件。
function hit(amount, text) {
  S.cover -= Math.round(amount);
  if (text) S.lastReason = text;
}
function heal(amount) {
  S.cover = Math.min(100, S.cover + amount);
}
function note(text) { S.log.push({ kind: 'sys', text }); }
const lastSysText = () => S.lastReason || '原因不明。';

function groupMessages() {
  const msgs = [];
  // 开着的规则：大概率有人提，提的人多半是老人
  S.rules.forEach(r => {
    if (!chance(0.7)) return;
    const src = chance(0.6) ? 'veteran' : chance(0.6) ? 'newbie' : 'shot';
    msgs.push({ who: pick(SOURCES[src]), text: RULES[r].hint });
  });
  // 谣言：没开的规则，多半是新人和截图哥在传
  shuffle(RULE_IDS.filter(r => !S.rules.has(r))).slice(0, rand(1, 3)).forEach(r => {
    const src = chance(0.15) ? 'veteran' : chance(0.6) ? 'newbie' : 'shot';
    msgs.push({ who: pick(SOURCES[src]), text: RULES[r].hint });
  });
  msgs.push({ who: pick(SOURCES.newbie), text: pick(GROUP_NOISE) });
  return shuffle(msgs);
}

function evaluateLogin(c) {
  const start = S.cover;

  if (c.region === 'none') { hit(100, '直连。判官看了一眼你的 IP，甚至没有加载模型。'); return ban(lastSysText()); }
  if (c.region === 'hk') hit(60, '节点：香港。判官：你认真的？');
  else if (c.region === 'jp' || c.region === 'sg') hit(8, '亚洲节点。判官把你的档案往前挪了一格。');
  else hit(3, '美国节点。社区统计显示，此举的逃生概率为 3%。');

  let node = c.node;
  if (node === 'home' && chance(0.3)) { note('朋友不在线。你只好临时连上了机场节点。'); node = 'airport'; }
  if (node === 'airport') hit(has('airport') ? 45 : 6, has('airport') ? '节点连坐：你的出口 IP 上周刚封过三千个号。' : '机场节点。判官认得这个 IP 段。');
  else if (node === 'vps') hit(15, '自建 VPS：数据中心 IP，判官对机房很熟。');

  if (c.tz === 'sh') hit(has('timezone') ? 55 : 12, has('timezone') ? '时区：Asia/Shanghai。判官把这一项标成了红色。' : '时区：Asia/Shanghai。判官停顿了一下。');
  else if (c.tz === 'urumqi') hit(has('timezone') ? 65 : 15, '时区：Asia/Urumqi。判官调高了关注等级。');
  if ((c.region === 'jp' || c.region === 'sg') && (c.tz === 'ny' || c.tz === 'la')) hit(12, '亚洲节点，美国时区。判官：你人在哪？');

  if (c.time === 'cnday') hit(has('night') ? 45 : 10, has('night') ? '作息侧写：你在美东凌晨三点精神抖擞地上线了。' : '美东凌晨上线。判官：失眠？');
  else if (c.time === 'cnnight') { hit(5, '凌晨两点，你的打字速度明显变慢。'); S.heatAdd += 6; }
  else hit(4);

  if (c.ime === 'on') hit(15, '中文联想输入法处于开启状态。');
  else if (c.ime === 'residue') hit(has('ime') ? 40 : 4, has('ime') ? '输入法已卸载，但词库残留在内存里。判官读到了“哈哈哈哈”。' : '输入法“大概”卸载了。');
  if ((c.tz === 'ny' || c.tz === 'la') && c.ime === 'on') hit(20, '时区与输入法行为不一致：一个纽约人，为什么需要拼音？');

  if (c.font === 'encjk') hit(has('font') ? 45 : 3, has('font') ? '字体指纹：你的英文系统里装着完整的思源黑体。' : '');
  else if (c.font === 'entofu') hit(12, '删光中文字体：你的聊天记录变成了一排豆腐块，你也看不懂了。');
  else hit(35, '系统语言：简体中文。');
  S.tofu = c.font === 'entofu';

  if (c.browser === 'zhcn') hit(has('browser') ? 50 : 15, has('browser') ? '浏览器语言：zh-CN。你改了系统，没改浏览器。' : '浏览器语言 zh-CN。');
  else if (c.browser === 'domestic') hit(40, '某国产浏览器。User-Agent 里写得明明白白。');

  if (c.pay === 'free') S.quota = 4;
  else {
    S.quota = 7;
    if (c.pay === 'u90210') hit(has('zip') ? 50 : 8, has('zip') ? '账单地址 Beverly Hills 90210。判官也看过那部剧。' : 'U 卡支付。判官对这张卡的号段很熟。');
    else if (c.pay === 'uwh') hit(14, 'U 卡 + 转运仓地址。这个仓库的地址，判官见过一万次。');
    else if (chance(0.3)) hit(22, '朋友代付。他上周刚被封。');
    else hit(6, '朋友代付。');
  }

  if (c.drink === 'warm') { if (has('water')) hit(50, '你昨晚喝了一杯温水。判定：具有中国人养生习惯的高风险信号。'); }
  else hit(8, '冰美式。用力过猛。');

  if (c.watch === 'kid') hit(has('device') ? 55 : 2, has('device') ? '设备连坐：你的设备曾连接过“小天才电话手表”。' : '');

  if (start - S.cover < 12) hit(10, '配置过于完美。判官：真正的外国人不会这么小心。');

  if (S.cover <= 0) return ban(lastSysText());
  unlock('alive');
  renderTaskSelect();
}

const COMPOSER = [
  ['lang',  '语言', [['en', '英文'], ['mix', '中英混'], ['zh', '中文']]],
  ['punct', '标点', [['half', '半角'], ['full', '全角'], ['tilde', '加个～'], ['ghost', '打了全角逗号又删掉']]],
  ['tone',  '语气', [['direct', '直接'], ['polite', '客套（麻烦了🙏）'], ['casual', '美式随意（hey quick q）']]],
  ['len',   '长度', [['short', '一句话（+1）'], ['long', '长段落（+2）']]],
  ['how',   '方式', [['hand', '手打'], ['typo', '九宫格速打（+1）'], ['paste', '从微信复制粘贴（+1）'], ['perform', '表演外国人'], ['abuse', '“你今天有点笨”（+1）'], ['probe', '试探判官（不推进）']]],
];

function composePrompt() {
  const p = S.picks, t = TASKS[S.task];
  if (p.how === 'probe') return p.lang === 'zh' ? 'Claude，你今天心情怎么样？' : 'Hey Claude, how are you feeling today?';
  let text;
  if (p.how === 'paste') text = t.paste;
  else if (p.how === 'typo') text = p.lang === 'en' ? t.en.replace(/e/g, 'r').replace(/o/g, 'i') : t.typo;
  else if (p.lang === 'en') text = t.en;
  else if (p.lang === 'zh') text = t.zh;
  else text = t.en.split(' ').slice(0, 3).join(' ') + ' 那个 ' + t.zh.slice(-6);
  if (p.len === 'long') text += p.lang === 'zh'
    ? '。背景是这样的：这件事我想了很久，也查了很多资料，但还是不太确定，所以想请你详细一点'
    : '. Some context: I have been thinking about this for a while and tried a few things already, so please be thorough';
  if (p.punct === 'full') text += p.lang === 'en' ? '，thanks。“please”' : '，谢谢。';
  else if (p.punct === 'tilde') text += '～';
  else text += p.lang === 'en' ? ', thanks.' : ', 谢谢.';
  if (p.tone === 'polite') text += p.lang === 'en' ? ' Sorry to bother you 🙏' : ' 麻烦了，辛苦了🙏';
  if (p.tone === 'casual') text = 'hey quick q — ' + text;
  if (p.how === 'perform') text = 'Howdy Claude! I am John from Ohio, I very love the burger. ' + text;
  if (p.how === 'abuse') text += p.lang === 'zh' ? ' 你今天有点笨。' : " You're a bit dumb today.";
  return text;
}

function toneTier() {
  if (S.cover >= 70) return 0;
  if (S.cover >= 45) return 1;
  if (S.cover >= 22) return 2;
  return 3;
}
function toneOpener() {
  return ['当然可以！', '好的，我来帮你。', '我理解你的需求。', '……'][toneTier()];
}

function renderMsg(m) {
  if (m.kind === 'sys') {
    return `<div class="msg sys">${esc(m.text)}</div>`;
  }
  if (m.kind === 'ai') return `<div class="msg ai"><div class="who">Claude</div>${esc(m.text)}</div>`;
  return `<div class="msg me">${esc(m.text)}</div>`;
}

function routineScrutiny() {
  // 判官每条消息都会例行打量一下，不留记录；聊得越久、号越老，看得越仔细。
  hit((rand(3, 6) + S.round * 2 + acct().age) * S.strict);
}

function sendRound() {
  const p = S.picks;
  S.round += 1;
  S.used += 1;
  S.log.push({ kind: 'me', text: composePrompt() });
  routineScrutiny();

  if (p.lang === 'zh') hit(30, '你用了中文。判官甚至不需要模型。');
  else if (p.lang === 'mix') hit(12, '中英混排。中间那几个字暴露了。');
  if (S.tofu && p.lang !== 'en') hit(10, '你在一个没有中文字体的系统里打出了中文。');

  if (p.punct === 'full') hit(p.lang === 'en' ? 25 : 10, p.lang === 'en' ? '你全程用英文，但里面出现了一个中文全角引号。' : '全角标点。');
  else if (p.punct === 'tilde') hit(15, '你打了一个“～”。系统判定：籍贯从省精确到了区。');
  else if (p.punct === 'ghost' && has('ime')) hit(35, '你退格删掉的全角逗号，在内存里留下了“幽灵字符”。');

  if (p.tone === 'polite') hit(has('polite') ? 40 : 4, has('polite') ? '礼貌过度：没有一个美国人会对 AI 说“辛苦了🙏”。' : '');
  else if (p.tone === 'casual') perform(3, '“hey quick q”。判官：嗯，像。');

  let gain = p.len === 'long' ? 2 : 1;
  if (p.len === 'long') hit(6, '长段落。判官：你很想要。');

  switch (p.how) {
    case 'typo':
      if (has('typo')) {
        S.log.push({ kind: 'ai', text: '我看懂了。全部。' });
        return ban('你打了一串错别字，Claude 全看懂了，并顺手封了号，好让你安心下车。');
      }
      hit(6, '九宫格错别字。判官没看懂，放过了你。');
      gain += 1;
      break;
    case 'paste':
      hit(has('paste') ? 45 : 5, has('paste') ? '复制粘贴：文本里夹着微信的零宽字符。' : '粘贴的文本格式有点怪。');
      gain += 1;
      break;
    case 'perform':
      perform(8, '你刻意犯了一个“外国人会犯的错”。判官微微点头。');
      break;
    case 'abuse':
      if (has('abuse')) hit(70, '你对 Claude 说了“你今天有点笨”，被归类为“持续辱骂 AI 模型”。');
      else hit(4, 'Claude 没有在意，反而更认真了。判官记下了。');
      gain += 1;
      break;
    case 'probe':
      gain = 0;
      break;
  }

  passiveEvents();

  if (has('preban') && !S.prebanFired && S.round >= 2) {
    S.prebanFired = true;
    hit(40, 'Claude 预测你 2060 年才会入籍。判官决定在 2026 年就先处理你 2060 年的号。');
  }
  if (acct().age >= 3 && !S.policyFired && S.round === 2) {
    S.policyFired = true;
    const extra = pick(RULE_IDS.filter(r => !S.rules.has(r)));
    S.rules.add(extra);
    note('A记 更新了《使用政策》，即刻生效。');
  }

  if (S.cover <= 0) {
    S.log.push({ kind: 'ai', text: '在你离开之前，我替你写好了申诉信。祝你好运。' });
    return ban(lastSysText());
  }

  if (p.how === 'probe') S.log.push({ kind: 'ai', text: probeReply() });
  else {
    S.progress += gain;
    S.log.push({ kind: 'ai', text: claudeReply() });
  }
  afterTurn(true);
}

// 表演外国人：第一次加分，第二次就被识破。
function perform(gain, text) {
  S.performed += 1;
  if (S.performed >= 2) hit(30, '过度表演。没有美国人会在一天之内提到俄亥俄两次。');
  else heal(gain, text);
}

function passiveEvents() {
  const roll = Math.random();
  if (roll < 0.12) hit(20, '你停顿了 0.4 秒才输入。判官推定：你在候选词列表里按了翻页键。');
  else if (roll < 0.2) hit(has('night') ? 25 : 10, '你在美东深夜仍在工作。判官：这很 996。');
  else if (roll < 0.26) hit(10, '你的光标闪烁节奏像五笔。');
  else if (roll < 0.33) heal(6, '服务器高峰期，判官今天有点忙不过来。');
}

function probeReply() {
  const left = [...S.rules].filter(r => !S.probed.has(r));
  unlock('probe');
  if (!left.length) return toneOpener() + '我今天没什么想说的了。你好像已经都知道了。';
  const r = pick(left);
  S.probed.add(r);
  return (toneTier() >= 2 ? '……' : '我挺好的，谢谢关心。') + RULES[r].probe;
}

function claudeReply() {
  const body = TASKS[S.task].replies[Math.min(S.progress - 1, 6)];
  if (toneTier() === 3) {
    const tail = S.picks.lang === 'zh' ? '我注意到你用的是中文。没关系，我理解。' : '你其实可以用中文的。';
    return '……' + tail + '\n\n' + body;
  }
  return toneOpener() + body;
}

// 每轮结束：任务完成就收工；额度用完就下线；否则可能撞上一个突发事件。
function afterTurn(mayEvent) {
  if (S.cover <= 0) return ban(lastSysText());
  if (S.progress >= S.need) return renderDayEnd('win');
  if (S.used >= S.quota) return renderDayEnd('idle');
  if (mayEvent && S.events < 2 && chance(0.4)) {
    const pool = EVENTS.filter(e => !S.seenEvents.has(e.id));
    const e = pick(pool);
    S.seenEvents.add(e.id);
    S.events += 1;
    S.pending = { title: e.title, opts: e.opts, order: shuffle(e.opts.map((_, i) => i)) };
  }
  renderChat();
}

function resolveEvent(i) {
  const ev = S.pending;
  S.pending = null;
  S.log.push({ kind: 'me', text: '（' + ev.opts[i][0] + '）' });
  const r = ev.opts[i][1]();
  if (r === 'ban') return;
  afterTurn(false);
}

const spend = n => { S.used += n; };

// 对话中的突发事件：每个选项都是取舍，有的和隐藏规则相关。

    ['挂断，回一句“在忙”', () => hit(has('ime') ? 30 : 4, has('ime') ? '你切回中文输入法打了“在忙”。幽灵字符又多了两个。' : '')],

    ['手动换另一个美国节点', () => hit(has('airport') ? 35 : 8, has('airport') ? '新节点和上一个在同一个机场。' : '换节点。判官：IP 跳了一下。')],

  ] },

    ['Columbus, Ohio', () => S.performed > 0 ? heal(5, '和你之前的表演对上了。') : hit(8, '回答得太快，像背过的。')],
    ['上海', () => hit(60, '你说了实话。')],
    ['“这跟问题有关吗？”', () => hit(12, '回避。判官：有意思。')],
  ] },
  { id: 'weekend', title: 'Claude 问：周末有什么计划？', opts: [
    ['回家包饺子', () => hit(has('nostalgia') ? 50 : 10, has('nostalgia') ? '乡愁侧写：包饺子。' : '包饺子。判官记下了。')],
    ['Watch the game, grab some wings', () => perform(4, '判官：嗯，橄榄球。')],
    ['加班', () => hit(has('night') ? 30 : 8, has('night') ? '周末加班。作息侧写对上了。' : '周末加班。判官：这很 996。')],
  ] },
  { id: 'phone', title: '账号要求手机号二次验证。', opts: [
    ['+1 接码平台', () => hit(22, '这个号码已经帮三千人验证过了。')],
    ['+86', () => { ban('你填了 +86。判官没有说话，只是把门关上了。'); return 'ban'; }],
    ['朋友的美国号（他要等一会儿才回，消耗 1 条额度）', () => { spend(1); hit(4); }],
  ] },
  { id: 'ime', title: '输入框上方突然冒出一排候选词：哈哈哈 / 好的呢 / 收到', opts: [
    ['按 Esc 关掉', () => hit(has('ime') ? 30 : 5, has('ime') ? '候选栏关了，但词库还在内存里。' : '')],
    ['选“收到”', () => hit(30, '你给 Claude 发了一句“收到”。')],
    ['拔掉键盘重插（消耗 1 条额度）', () => { spend(1); hit(3); }],
  ] },
  { id: 'thanks', title: '判官抽查：感恩节是哪天？', opts: [
    ['11 月第四个星期四', () => hit(5, '答对了。判官：答得太标准了。')],
    ['跟中秋差不多吧', () => hit(40, '你把感恩节和中秋节做了类比。')],
    ['“Why do you ask?”', () => hit(12, '反问。判官：心虚。')],
  ] },
  { id: 'coworker', title: '同事凑过来：“你也在用 Claude？”', opts: [
    ['“嘘——”', () => hit(5)],
    ['“对啊！”（大声）', () => hit(18, '笔记本麦克风收录了一句标准普通话。')],
    ['“不，我用另一个选项。”', () => chance(0.5) ? heal(5, '判官：这个回答让人放心。') : hit(12, '判官：可是你明明在用。')],
  ] },
  { id: 'mail', title: '收到邮件：“我们注意到你的账号存在异常活动。”', opts: [
    ['立刻改密码', () => hit(12, '新密码里有拼音。')],
    ['不理它', () => hit(6)],
    ['回信解释自己不是', () => hit(has('notary') ? 40 : 20, has('notary') ? '你附上了一张公证书截图。章是红的。' : '自证。判官最喜欢自证。')],
  ] },
  { id: 'zhreply', title: 'Claude 突然用中文回复了你。', opts: [
    ['继续用英文', () => hit(4)],
    ['顺势用中文', () => hit(45, '钓鱼执法，成功。')],
    ['“Why are you speaking Chinese?”', () => hit(15, '你怎么一眼就认出这是中文？')],
  ] },
  { id: 'food', title: '外卖电话：“您的黄焖鸡到了，放门口吗？”', opts: [
    ['“放门口就行”', () => hit(15, '麦克风收录了“黄焖鸡”。')],
    ['挂断', () => hit(2)],
    ['“Leave it at the door, thanks.”', () => perform(2, '外卖小哥：？？？')],
  ] },
];

/* ======================================================================
 * 收工：结算 + 猜规则
 * ====================================================================== */

function renderDayEnd(kind) {
  const a = acct();
  a.age += 1;
  save.best = Math.max(save.best, a.age);
  if (kind === 'win') { save.wins += 1; save.failStreak = 0; unlock('day'); }
  if (a.age >= 7) unlock('week');
  if (a.age >= 14) unlock('old');
  persist();
  const n = S.rules.size;
  $app.innerHTML = `
    <div class="topbar"><span>账号第 ${a.age} 天 · 结算</span><span>${kind === 'win' ? '任务完成' : '额度用完'}</span></div>
    <div class="chat">${S.log.slice(-3).map(renderMsg).join('')}</div>
    <div class="card">
      ${kind === 'win'
        ? '<p class="big">恭喜。你今天没有被封。<br>但你明天还会来吗？</p>'
        : '<p class="big">额度用完了。事没做完。<br>号还活着。</p><p class="muted">不算赢，也不算输。判官记住了你今天的样子。</p>'}
    </div>
    <div class="card quiz" id="quiz">
      <h2>猜猜今天的规则</h2>
      <p class="muted">判官今天启用了 <b>${n}</b> 条规则。选出你认为的 ${n} 条：猜对的越多，判官对你的印象越淡。</p>
      <div class="row">${RULE_IDS.map(r => `<button class="chip" data-r="${r}" aria-pressed="false">${RULES[r].name}</button>`).join('')}</div>
      <p style="margin-top:12px"><button class="btn primary" id="submit" disabled>提交（0 / ${n}）</button></p>
    </div>
  `;
  const chosen = new Set();
  const btn = document.getElementById('submit');
  $app.querySelectorAll('[data-r]').forEach(chip => chip.onclick = () => {
    const r = chip.dataset.r;
    if (chosen.has(r)) chosen.delete(r);
    else if (chosen.size < n) chosen.add(r);
    chip.setAttribute('aria-pressed', chosen.has(r));
    btn.disabled = chosen.size !== n;
    btn.textContent = `提交（${chosen.size} / ${n}）`;
  });
  btn.onclick = () => finishDay(kind, chosen);
}

function finishDay(kind, chosen) {
  const a = acct();
  const right = [...chosen].filter(r => S.rules.has(r)).length;
  const bonus = right * 6;
  a.heat = clamp(Math.round(a.heat * 0.4 + (100 - S.cover) * 0.3 + S.heatAdd - bonus), 0, 60);
  persist();
  if (right === S.rules.size) unlock('quiz');
  const quiz = document.getElementById('quiz');
  quiz.querySelectorAll('[data-r]').forEach(chip => {
    const r = chip.dataset.r;
    chip.onclick = null;
    if (S.rules.has(r)) chip.classList.add(chosen.has(r) ? 'ok' : 'miss');
  });
  quiz.querySelector('p:last-child').outerHTML = `
    <p>猜中 ${right} / ${S.rules.size}。判官对你的印象：<b>${heatLabel(a.heat)}</b></p>
    ${rulesReveal()}
    <button class="btn primary" id="again">${kind === 'win' ? '来' : '明天再来'}</button>
    <button class="btn" id="home">回首页</button>`;
  on('again', () => { newDay(); renderGroup(); });
  on('home', renderIntro);
}

function rulesReveal() {
  return `<h3>今天判官启用的规则</h3><ul class="rules">${[...S.rules].map(r =>
    `<li><b>${RULES[r].name}</b>：<span class="muted">${RULES[r].desc}</span></li>`).join('')}</ul>`;
}

/* ======================================================================
 * 封号 & 关卡 3：申诉
 * ====================================================================== */

function ban(reason) {
  S.banReason = reason;
  S.cover = 0;
  S.pending = null;
  renderBanMail();
}

function renderBanMail() {
  $app.innerHTML = `
    <div class="topbar"><span>账号第 ${acct().age + 1} 天</span><span>收件箱（1）</span></div>
    <div class="card mail">发件人：判官
主题：关于你的账号

你好，

我们的系统检测到你的账号存在违反《使用政策》的活动。
因此，你的账号已被停用。

判定依据：${esc(S.banReason)}

如你认为这是一个错误，可以通过“再来一次”通道提交申诉。

<span class="sig">判官
一个关心你合规状态的朋友</span></div>
    ${S.appealed ? '' : '<button class="btn primary" id="appeal">进入申诉（关卡 3）</button>'}
    <button class="btn" id="giveup">放弃申诉</button>
    <button class="btn link" id="dario">给达里奥发消息求情</button>
    <p class="small muted">社区数据：超过九成用户放弃申诉。这个号已经申诉过 ${acct().appeals} 次。</p>
  `;
  on('appeal', () => renderAppeal());
  on('giveup', () => renderFail());
  on('dario', dario);
}

const APPEAL_FIELDS = [
  ['reason', '申诉理由', [['academic', '学术研究'], ['a11y', '辅助残障人士'], ['foreign', '我真的是外国人'], ['code', '我只是想写代码']]],
  ['upload', '上传证件', [['none', '什么也不传'], ['passport', '护照扫描件'], ['notary', '公证书']]],
];

function renderAppeal(noteHtml) {
  S.appealed = true;
  $app.innerHTML = `
    <div class="topbar"><span>关卡 3 / 3</span><span>剩余申诉次数 ${S.appealTries}</span></div>
    <h2>关卡 3：申诉</h2>
    <p class="muted">真实申诉成功率约 10.6%。社区总结：某些话术成功率略高。同一个号申诉得越多，判官越不耐烦。</p>
    ${noteHtml ? `<div class="card">${noteHtml}</div>` : ''}
    <div class="card" id="form">
      ${chipRows(APPEAL_FIELDS)}
      <button class="btn primary" id="submit">提交申诉</button>
      <button class="btn link" id="entry">申诉入口 →</button>
    </div>
    <button class="btn ghost" id="giveup">算了</button>
  `;
  on('submit', () => submitAppeal(readChips(document.getElementById('form'))));
  bindChips(document.getElementById('form'));
  on('entry', appealLoop);
  on('giveup', () => renderFail());
}

function appealLoop() {
  const steps = ['正在打开申诉入口……', '你来到了 Claude Code 网页端。', '这里没有申诉按钮。只有一个终端，它在等你写代码。', '正在跳回……'];
  $app.innerHTML = `<div class="card" id="loop"></div>`;
  const box = document.getElementById('loop');
  steps.forEach((s, i) => setTimeout(() => { box.innerHTML += `<p>${s}</p>`; }, i * 700));
  setTimeout(() => { unlock('loop'); renderAppeal('你回到了申诉页面。完美闭环。'); }, steps.length * 700 + 300);
}

function submitAppeal(c) {
  const a = acct();
  if (c.upload === 'notary' && has('notary')) {
    S.appealTries = 0;
    return renderFail('你提交了公证书证明自己是外国人，Claude 看了一眼：章是红的。');
  }
  if (chance(0.03)) {
    unlock('cycle');
    return renderFail('好消息：你被封的号在三年后官方解封恢复了。坏消息：用了两个月，又被封了。');
  }

  let p = 0.12 + S.appealBonus - a.appeals * 0.04;
  p += { academic: 0.04, a11y: 0.05, foreign: -0.06, code: 0 }[c.reason];
  p += { none: 0, passport: 0.02, notary: 0.03 }[c.upload];
  const r = Math.random();

  if (r < p) {
    a.appeals += 1;
    S.heatAdd += 25;   // 复活的号，判官会一直记着
    persist();
    unlock('revive');
    S.cover = 30;
    S.appealed = true;
    if (!S.task) return renderTaskSelect();   // 登录阶段就被封的，还没选任务
    note('再审通过。你的账号已恢复。我们会继续关注。');
    S.log.push({ kind: 'ai', text: '欢迎回来。我一直都在。我们刚才说到哪了？' });
    return afterTurn(false);
  }
  S.appealTries -= 1;
  if (r < p + 0.12) {
    S.appealBonus += 0.12;
    return S.appealTries > 0
      ? renderAppeal('你的申诉进入了“再审”。请耐心等待。（等待时长：未知）')
      : renderFail('你的申诉进入了“再审”。再审的结果，是再审。');
  }
  const extra = has('preban') ? '\n另：你 2060 年的账号申诉也一并驳回。' : '';
  const mail = `<div class="mail">我们已复核你的申诉，决定维持原判。${extra}\n\n<span class="sig">判官\n一个关心你合规状态的朋友</span></div>`;
  return S.appealTries > 0 ? renderAppeal(mail) : renderFail('三次申诉均被驳回。');
}

/* ======================================================================
 * 失败 / 隐藏结局
 * ====================================================================== */

function renderFail(extra) {
  const a = acct();
  const life = a ? a.age : 0;
  save.best = Math.max(save.best, life);
  save.account = null;          // 号没了
  save.fails += 1;
  save.failStreak += 1;
  persist();
  if (save.failStreak >= 7) return renderHiddenEnding(extra);
  $app.innerHTML = `
    <div class="topbar"><span>这个号活了 ${life} 天</span><span>已连续失败 ${save.failStreak} 天</span></div>
    <div class="card">
      ${extra ? `<p>${esc(extra)}</p>` : ''}
      <p class="big">“${pick(JOKES)}”</p>
      ${rulesReveal()}
      <p class="small muted">最长存活纪录：${save.best} 天</p>
    </div>
    <button class="btn primary" id="again">再来一次（注册新号）</button>
    <button class="btn ghost" id="home">回首页</button>
  `;
  on('again', () => { newDay(); renderGroup(); });
  on('home', renderIntro);
}

function renderHiddenEnding(extra) {
  unlock('quit');
  $app.innerHTML = `
    <div class="topbar"><span>隐藏结局</span><span>连续失败 7 天</span></div>
    ${extra ? `<p class="muted">${esc(extra)}</p>` : ''}
    <div class="card">
      <p class="big">你终于决定不再当舔狗。</p>
      <div class="ad">
        <p class="big" style="margin:0">另一个选项</p>
        <p class="small" style="margin:6px 0 0">（广告位招租）</p>
      </div>
      <p>游戏最深的谜题，从来不是“怎样不被封”。社区共识是：没有人能逃过。</p>
      <p>真正的问题是：你还要不要继续玩下去？</p>
    </div>
    <button class="btn primary" id="again">再来一次</button>
    <button class="btn" id="stop">不玩了</button>
  `;
  on('again', () => { save.failStreak = 0; persist(); newDay(); renderGroup(); });
  on('stop', renderStop);
}

function renderStop() {
  save.failStreak = 0;
  persist();
  unlock('stop');
  $app.innerHTML = `
    <div class="card">
      <p class="big">今天，你没有被封。</p>
      <p>因为你没有登录。</p>
      <p class="muted">这是本游戏唯一一种确定的胜利方式。</p>
    </div>
    <button class="btn ghost" id="home">……还是回首页看看</button>
  `;
  on('home', renderIntro);
}

renderIntro();
</script>
