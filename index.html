<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>不被封的一天</title>
<meta name="description" content="回合制生存 / 策略解谜 / 黑色幽默：在判官眼皮底下用完今天的 Claude 对话额度，并且号还活着。">
<style>
:root {
  --bg: #efe9df;
  --panel: #fbf9f5;
  --panel-2: #f3efe7;
  --ink: #23201c;
  --muted: #776f64;
  --line: #e2dbcf;
  --accent: #c2603f;
  --accent-ink: #fff;
  --danger: #b3362b;
  --ok: #2f7a4e;
  --me: #ece4d6;
  --chip: #ede7dc;
  --sel: #23201c;
  --sel-ink: #f6f2ea;
  --bar: rgba(250, 247, 241, .72);
  --dock: rgba(250, 247, 241, .55);
  --shadow: 0 18px 50px rgba(40, 28, 15, .22), 0 2px 8px rgba(40, 28, 15, .12);
  --wall-1: #f0b98f; --wall-2: #d9826a; --wall-3: #8e5a7a; --wall-4: #3d3a5c;
  --term-bg: #1d1b19; --term-ink: #e6e0d4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --panel: #252321; --panel-2: #2c2a27; --ink: #ece7de; --muted: #a39c90; --line: #3a3631;
    --accent: #d9774f; --me: #36312b; --chip: #312d29; --sel: #ece7de; --sel-ink: #1b1a18;
    --bar: rgba(30, 28, 26, .72); --dock: rgba(40, 37, 34, .55);
    --shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
    --wall-1: #5a3a3a; --wall-2: #3e2e45; --wall-3: #262640; --wall-4: #121420;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --panel: #252321; --panel-2: #2c2a27; --ink: #ece7de; --muted: #a39c90; --line: #3a3631;
  --accent: #d9774f; --me: #36312b; --chip: #312d29; --sel: #ece7de; --sel-ink: #1b1a18;
  --bar: rgba(30, 28, 26, .72); --dock: rgba(40, 37, 34, .55);
  --shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
  --wall-1: #5a3a3a; --wall-2: #3e2e45; --wall-3: #262640; --wall-4: #121420;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* ---------- 屏幕与壁纸 ---------- */
#screen { position: fixed; inset: 0; overflow: hidden; }
#wall {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 80% at 80% 110%, var(--wall-4) 0%, transparent 60%),
    radial-gradient(90% 70% at 10% 100%, var(--wall-3) 0%, transparent 65%),
    radial-gradient(110% 90% at 70% 0%, var(--wall-1) 0%, transparent 60%),
    linear-gradient(160deg, var(--wall-1), var(--wall-2) 45%, var(--wall-3) 80%, var(--wall-4));
}
#wall::after {
  content: ""; position: absolute; left: 50%; top: 46%; width: 46vmin; height: 46vmin; transform: translate(-50%, -50%);
  border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 210, .55), rgba(255, 236, 210, 0) 70%);
  filter: blur(6px);
}
.shake { animation: shake .5s cubic-bezier(.36, .07, .19, .97) both; }
@keyframes shake { 10%, 90% { transform: translateX(-2px) } 20%, 80% { transform: translateX(4px) } 30%, 50%, 70% { transform: translateX(-8px) } 40%, 60% { transform: translateX(8px) } }
#flash { position: absolute; inset: 0; pointer-events: none; z-index: 900; opacity: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(200, 20, 10, .55)); }
#flash.on { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { opacity: 0 } 15% { opacity: 1 } 100% { opacity: 0 } }

/* ---------- 菜单栏 ---------- */
#menubar {
  position: absolute; top: 0; left: 0; right: 0; height: 28px; z-index: 600;
  display: flex; align-items: center; gap: 14px; padding: 0 12px; font-size: 13px;
  background: var(--bar); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border-bottom: 1px solid rgba(0, 0, 0, .06);
}
#menubar .logo { font-weight: 800; font-size: 15px; }
#menubar .app { font-weight: 600; }
#menubar .menus span { margin-right: 12px; opacity: .85; }
#menubar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
#menubar .ind { padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; font-size: 11px; line-height: 16px; opacity: .85; }
#menubar .vpn.off { color: var(--danger); }
#menubar button { border: 0; background: none; padding: 0; font-size: 13px; }

/* ---------- 桌面图标 ---------- */
#desk { position: absolute; top: 44px; right: 18px; display: flex; flex-direction: column; gap: 14px; z-index: 1; }
.dicon { width: 84px; text-align: center; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); font-size: 12px; background: none; border: 0; padding: 4px; border-radius: 6px; }
.dicon:focus-visible, .dicon:hover { background: rgba(255, 255, 255, .15); }
.dicon .ico { width: 48px; height: 48px; margin: 0 auto 4px; border-radius: 10px; display: grid; place-items: center; font-size: 26px; text-shadow: none; }

/* ---------- 窗口 ---------- */
#wins { position: absolute; inset: 28px 0 0 0; }
.win {
  position: absolute; display: none; flex-direction: column; overflow: hidden;
  background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid rgba(0, 0, 0, .08);
  min-width: 300px; min-height: 200px;
}
.win.open { display: flex; animation: winIn .18s ease-out; }
@keyframes winIn { from { transform: scale(.96); opacity: 0 } to { transform: none; opacity: 1 } }
.win.glitch { animation: glitch .6s steps(2) 2; }
@keyframes glitch { 0% { clip-path: inset(0 0 60% 0); transform: translate(-6px, 0) } 25% { clip-path: inset(40% 0 20% 0); transform: translate(6px, 0) } 50% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 0); filter: hue-rotate(90deg) } 75% { clip-path: inset(70% 0 0 0); transform: translate(3px, 0) } 100% { clip-path: inset(0); transform: none } }
.tbar {
  height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; position: relative;
  background: var(--panel-2); border-bottom: 1px solid var(--line); cursor: default; touch-action: none;
}
.lights { display: flex; gap: 8px; position: relative; z-index: 1; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; cursor: pointer; }
.lights .c { background: #ff5f57; } .lights .m { background: #febc2e; } .lights .z { background: #28c840; }
.win:not(.focus) .lights i { background: #cfc8bd; }
.tbar .title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 13px; pointer-events: none; color: var(--muted); }
.win.focus .tbar .title { color: var(--ink); }
.wbody { flex: 1; min-height: 0; display: flex; position: relative; }

/* ---------- Dock ---------- */
#dock {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 500;
  display: flex; gap: 6px; padding: 6px 8px; border-radius: 18px;
  background: var(--dock); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, .25); box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
}
.dk { position: relative; width: 52px; height: 52px; border: 0; padding: 0; background: none; border-radius: 13px; transition: transform .15s; }
.dk:hover { transform: translateY(-6px) scale(1.08); }
.dk .ico { width: 100%; height: 100%; border-radius: 13px; display: grid; place-items: center; font-size: 24px; font-weight: 700; color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25), 0 2px 6px rgba(0, 0, 0, .2); }
.dk .dot { position: absolute; bottom: -5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink); opacity: 0; }
.dk.running .dot { opacity: .7; }
.dk .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ff3b30; color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; display: none; }
.dk .badge.on { display: block; }
.dk.bounce { animation: bounce .7s ease 3; }
@keyframes bounce { 0%, 100% { transform: none } 40% { transform: translateY(-16px) } }
.dk .tip { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--ink); padding: 2px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .2); transition: opacity .15s; }
.dk:hover .tip { opacity: 1; }
.i-group { background: linear-gradient(160deg, #5fd36b, #23a046); }
.i-set { background: linear-gradient(160deg, #9aa1a8, #5f666d); }
.i-web { background: linear-gradient(160deg, #e8875f, #c2603f); }
.i-mail { background: linear-gradient(160deg, #5aaefc, #2a72e0); }
.i-term { background: linear-gradient(160deg, #3b3936, #161513); font-family: ui-monospace, Menlo, monospace; font-size: 18px !important; }
.i-ach { background: linear-gradient(160deg, #f6c64f, #e0912a); }
.i-txt { background: linear-gradient(160deg, #fdfcf9, #e7e2d8); color: #555; }
.i-dmg { background: linear-gradient(160deg, #d6d2cb, #a39d93); }
.i-bin { background: linear-gradient(160deg, #e0e6ea, #a8b3ba); }

/* ---------- 通知 ---------- */
#notifs { position: absolute; top: 36px; right: 12px; z-index: 700; display: flex; flex-direction: column; gap: 8px; width: 340px; max-width: calc(100% - 24px); pointer-events: none; }
.nt {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; cursor: pointer; pointer-events: auto;
  background: var(--bar); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .2); border: 1px solid rgba(255, 255, 255, .2);
  animation: ntIn .35s cubic-bezier(.2, .9, .3, 1.2);
}
.nt.out { animation: ntOut .3s ease-in forwards; }
@keyframes ntIn { from { transform: translateX(120%) } to { transform: none } }
@keyframes ntOut { to { transform: translateX(120%); opacity: 0 } }
.nt .ico { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 18px; color: #fff; }
.nt b { display: block; font-size: 13px; }
.nt span { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- 全屏层：开机 / 锁屏 / 蓝屏 / 关机 ---------- */
.layer { position: absolute; inset: 0; z-index: 800; display: none; }
.layer.on { display: block; }
#boot { background: #000; color: #fff; }
#boot.on { display: grid; place-items: center; }
#boot .logo { font-size: 56px; font-weight: 800; text-align: center; letter-spacing: .05em; }
#boot .pb { width: 200px; height: 5px; border-radius: 3px; background: #333; margin: 28px auto 0; overflow: hidden; }
#boot .pb i { display: block; height: 100%; width: 0; background: #fff; transition: width 1.1s ease-in-out; }
#lock { color: #fff; text-align: center; text-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
#lock .blur { position: absolute; inset: 0; backdrop-filter: blur(30px) brightness(.9); -webkit-backdrop-filter: blur(30px) brightness(.9); }
#lock .in { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 9vh 16px 110px; overflow-y: auto; }
#lock .date { font-size: 18px; font-weight: 500; opacity: .9; }
#lock .time { font-size: clamp(64px, 16vw, 104px); font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
#lock .lnote { width: 360px; max-width: 100%; margin-top: 10px; text-align: left; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .22); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); text-shadow: none; color: #fff; font-size: 13px; }
#lock .lnote b { display: block; }
#lock .who { margin-top: auto; padding-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#lock .avatar { width: 72px; height: 72px; border-radius: 50%; background: rgba(255, 255, 255, .3); display: grid; place-items: center; font-size: 28px; font-weight: 700; border: 2px solid rgba(255, 255, 255, .6); }
#lock .stats { font-size: 13px; opacity: .9; }
#lock .unlock { margin-top: 10px; border: 0; padding: 10px 26px; border-radius: 22px; background: rgba(255, 255, 255, .85); color: #222; font-weight: 600; text-shadow: none; }
#lock .ach-mini { margin-top: 14px; font-size: 12px; opacity: .85; max-width: 420px; }
#bsod { background: #1f5fa8; color: #fff; }
#bsod .in { max-width: 760px; margin: 0 auto; padding: 10vh 24px 24px; height: 100%; overflow-y: auto; }
#bsod .sad { font-size: 110px; line-height: 1; font-weight: 300; }
#bsod .big { font-size: 22px; margin: 26px 0 12px; line-height: 1.5; }
#bsod .row { display: flex; gap: 18px; align-items: flex-start; margin-top: 24px; }
#bsod .qr { flex: none; width: 96px; height: 96px; background: #fff; padding: 6px; display: grid; grid-template-columns: repeat(12, 1fr); }
#bsod .qr i { background: #1f5fa8; }
#bsod .qr i.w { background: #fff; }
#bsod .info { font-size: 13px; line-height: 1.7; opacity: .95; min-width: 0; }
#bsod ul { padding-left: 18px; margin: 8px 0; }
#bsod button { margin: 22px 10px 0 0; border: 1px solid #fff; background: transparent; color: #fff; padding: 9px 18px; border-radius: 6px; }
#bsod button.primary { background: #fff; color: #1f5fa8; font-weight: 600; }
#off { background: #000; color: #9a9a9a; text-align: center; }
#off.on { display: grid; place-items: center; }
#off .tv { position: absolute; inset: 0; background: #fff; animation: tvOff .7s ease-in forwards; }
@keyframes tvOff { 0% { transform: scale(1, 1); opacity: 1 } 60% { transform: scale(1, .004); opacity: 1 } 100% { transform: scale(0, .004); opacity: 0 } }
#off .msg { opacity: 0; animation: fadeIn 1s 1.2s forwards; font-size: 18px; line-height: 2; padding: 16px; }
#off button { margin-top: 24px; background: none; border: 1px solid #555; color: #9a9a9a; padding: 8px 16px; border-radius: 6px; }
@keyframes fadeIn { to { opacity: 1 } }

/* ---------- 弹窗 ---------- */
#modal { z-index: 750; background: rgba(0, 0, 0, .18); padding: 16px; }
#modal.on { display: grid; place-items: center; }
.alert { width: 300px; max-width: 100%; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 20px 18px 14px; text-align: center; animation: winIn .18s ease-out; }
.alert .aico { font-size: 40px; line-height: 1; margin-bottom: 8px; }
.alert b { display: block; font-size: 14px; margin-bottom: 6px; }
.alert p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.alert .btns { display: flex; flex-direction: column; gap: 6px; }
.alert .btns button { border: 0; border-radius: 8px; padding: 7px 10px; background: var(--chip); }
.alert .btns button:first-child { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.sheet { width: 560px; max-width: 100%; max-height: calc(100vh - 40px); overflow-y: auto; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; animation: winIn .2s ease-out; }
.sheet h2 { margin: 0 0 6px; font-size: 20px; }
.sheet .big { font-size: 20px; font-weight: 600; line-height: 1.5; margin: 4px 0 12px; }
.sheet .rules { padding-left: 18px; }
.sheet .rules li { margin: 4px 0; }

/* ---------- 手机来电 ---------- */
#phone {
  position: absolute; right: 22px; bottom: 90px; z-index: 720; width: 250px; height: 470px; display: none;
  border-radius: 38px; background: #111; padding: 10px; box-shadow: 0 30px 60px rgba(0, 0, 0, .45);
}
#phone.on { display: block; animation: phoneIn .45s cubic-bezier(.2, .9, .3, 1.15); }
#phone.ring .scr { animation: ringpulse 1s ease-in-out infinite; }
@keyframes phoneIn { from { transform: translateY(120%) rotate(6deg) } to { transform: none } }
@keyframes ringpulse { 50% { filter: brightness(1.15) } }
#phone .scr { height: 100%; border-radius: 30px; overflow: hidden; color: #fff; text-align: center; padding: 36px 16px 22px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(170deg, #4b6a5e, #1d2a2b 70%); }
#phone .notch { width: 80px; height: 20px; background: #111; border-radius: 0 0 12px 12px; margin: -36px auto 18px; }
#phone .ptime { font-size: 12px; opacity: .8; }
#phone .cav { width: 74px; height: 74px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: grid; place-items: center; font-size: 34px; margin: 26px 0 10px; }
#phone .cname { font-size: 22px; font-weight: 600; }
#phone .csub { font-size: 13px; opacity: .75; }
#phone .pbtns { margin-top: auto; display: flex; flex-direction: column; gap: 8px; width: 100%; }
#phone .pbtns button { border: 0; border-radius: 22px; padding: 9px 10px; font-size: 13px; color: #fff; background: rgba(255, 255, 255, .18); }
#phone .pbtns button.g { background: #34c759; }
#phone .pbtns button.r { background: #ff3b30; }

/* ---------- 通用控件 ---------- */
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 14px; margin: 4px 6px 4px 0; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.lnk { border: 0; background: none; color: var(--accent); text-decoration: underline; padding: 4px 0; }
.chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
.chip.ok { outline: 2px solid var(--ok); outline-offset: 1px; }
.chip.miss { outline: 2px dashed var(--danger); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- 群聊 ---------- */
.g-side { width: 190px; flex: none; border-right: 1px solid var(--line); background: var(--panel-2); }
.g-item { display: flex; gap: 10px; padding: 10px 12px; align-items: center; }
.g-item.on { background: var(--chip); }
.g-item .av { flex: none; width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; font-size: 18px; background: var(--line); }
.g-item > div:last-child { min-width: 0; }
.g-item b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-item span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.g-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.g-msgs { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; background: var(--panel); }
.gm { display: flex; gap: 8px; align-items: flex-start; animation: pop .25s ease-out; }
.gm .av { flex: none; width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; font-size: 15px; background: var(--chip); }
.gm > div:last-child { min-width: 0; }
.gm .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.gm .bub { background: var(--panel-2); border: 1px solid var(--line); padding: 7px 10px; border-radius: 4px 10px 10px 10px; word-break: break-word; user-select: text; -webkit-user-select: text; display: inline-block; }
.g-time { align-self: center; font-size: 11px; color: var(--muted); }
.typing { display: inline-flex; gap: 3px; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
@keyframes pop { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
.g-input { border-top: 1px solid var(--line); padding: 10px 14px; color: var(--muted); font-size: 12px; background: var(--panel-2); }

/* ---------- 设置 ---------- */
.s-wrap { display: flex; flex: 1; min-width: 0; }
.s-side { width: 200px; flex: none; padding: 10px 8px; border-right: 1px solid var(--line); background: var(--panel-2); }
.s-tab { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.s-tab .si { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; color: #fff; flex: none; }
.s-tab.on { background: var(--accent); color: var(--accent-ink); }
.s-main { flex: 1; padding: 18px 22px; min-width: 0; }
.s-main h3 { margin: 0 0 14px; font-size: 18px; }
.s-group { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
.s-group .gl { font-size: 12px; color: var(--muted); padding: 8px 12px 4px; }
.s-opt { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 9px 12px; }
.s-group .gl + .s-opt { border-top: 0; }
.s-opt .rad { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; }
.s-opt[aria-pressed="true"] .rad { border-color: var(--accent); }
.s-opt[aria-pressed="true"] .rad::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.s-opt .t { flex: 1; }
.s-opt .d { display: block; font-size: 12px; color: var(--muted); }
.s-opt:disabled { cursor: default; opacity: .7; }
.s-lock { background: var(--chip); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }

/* ---------- 浏览器 ---------- */
.b-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.b-nav { color: var(--muted); letter-spacing: 6px; font-size: 14px; }
.b-url { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.b-page { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--panel); }

.center { flex: 1; display: grid; place-items: center; padding: 20px; text-align: center; overflow-y: auto; }

.scan { text-align: left; margin: 16px auto 0; width: 300px; max-width: 100%; font-size: 12px; }
.scan div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); animation: pop .2s; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }

.tasks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 560px; max-width: 100%; margin-top: 20px; }
.tcard { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 14px; }

.tcard b { display: block; margin-bottom: 4px; }
.tcard span { font-size: 12px; color: var(--muted); }
.c-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }

.c-msgs { flex: 1; min-height: 0; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; }
.cm { max-width: 640px; width: 100%; margin: 0 auto; animation: pop .25s ease-out; }

.cm.ai .mk { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
.cm.ai .txt { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; line-height: 1.7; font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; font-size: 15px; user-select: text; -webkit-user-select: text; }
.cm.ai .txt .caret { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink 1s infinite; }

.c-comp { padding: 0 16px 14px; flex: none; }
.c-box { max-width: 680px; margin: 0 auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel-2); padding: 10px 12px; box-shadow: 0 2px 10px rgba(0, 0, 0, .04); }
.c-input { min-height: 44px; max-height: 110px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; font-size: 14px; }

.c-send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; }
.c-send:disabled { opacity: .4; }
.c-foot { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; }
.banned { flex: 1; display: grid; place-items: center; text-align: center; padding: 20px; }
.banned .x { font-size: 52px; }

/* ---------- 邮件 ---------- */
.m-wrap { display: flex; flex: 1; min-width: 0; }
.m-side { width: 150px; flex: none; padding: 10px 8px; background: var(--panel-2); border-right: 1px solid var(--line); font-size: 13px; }

.m-side div.on { background: var(--chip); font-weight: 600; }
.m-list { width: 250px; flex: none; border-right: 1px solid var(--line); }

.m-it.on { background: var(--accent); color: var(--accent-ink); }

.m-it .s { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-it .p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-it .tm { position: absolute; right: 10px; top: 10px; font-size: 11px; color: var(--muted); }
.m-it.unread::before { content: ""; position: absolute; left: 5px; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: #2a72e0; }

.m-read h3 { margin: 0 0 6px; font-size: 18px; }

.m-acts { margin-top: 18px; }
.m-form { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.m-form label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
.m-back { display: none; }

/* ---------- 终端 ---------- */
.term { flex: 1; background: var(--term-bg); color: var(--term-ink); padding: 10px 12px; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; user-select: text; -webkit-user-select: text; }

.term .er { color: #ff8a7a; }
.term .dim { color: #8e877c; }

.term input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: inherit; font: inherit; padding: 0; caret-color: #8bd57e; }

/* ---------- 成就 / 文本 ---------- */
.a-wrap { flex: 1; padding: 18px; }
.a-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-bottom: 16px; }
.a-stats div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; }
.a-stats b { display: block; font-size: 20px; }
.a-stats span { font-size: 11px; color: var(--muted); }
.a-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.a-it { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; background: var(--panel-2); }
.a-it .e { font-size: 30px; }

.a-it.off { opacity: .45; filter: grayscale(1); }
.txt-wrap { flex: 1; padding: 16px 18px; white-space: pre-wrap; font: 13px/1.8 ui-monospace, "SF Mono", Menlo, Consolas, monospace; user-select: text; -webkit-user-select: text; background: var(--panel); }
.confetti { position: absolute; top: -12px; width: 8px; height: 12px; z-index: 760; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg) } }

/* ---------- 手机 / 窄屏 ---------- */
@media (max-width: 760px) {
  #menubar { gap: 8px; padding: 0 10px; }
  #menubar .menus { display: none; }
  #menubar .right { gap: 8px; }
  #wins { bottom: 76px; }
  .win { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; border: 0; min-width: 0; }
  .tbar { height: 40px; }
  #dock { left: 8px; right: 8px; transform: none; bottom: 8px; justify-content: space-between; overflow-x: auto; gap: 2px; padding: 6px; }
  .dk { width: 44px; height: 44px; flex: none; }
  .dk .ico { font-size: 21px; }
  .dk:hover { transform: none; }
  .dk .tip { display: none; }
  #desk { top: 40px; right: auto; left: 12px; flex-direction: row; flex-wrap: wrap; }
  .g-side, .m-side { display: none; }
  .s-wrap { flex-direction: column; }
  .s-side { width: auto; display: flex; overflow-x: auto; overflow-y: hidden; flex: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; gap: 4px; }
  .s-tab { width: auto; white-space: nowrap; flex: none; }
  .s-main { padding: 14px; }
  .m-list { width: 100%; border-right: 0; }
  .m-wrap.reading .m-list { display: none; }
  .m-wrap:not(.reading) .m-read { display: none; }
  .m-back { display: inline-block; margin-bottom: 8px; }
  .tasks { grid-template-columns: 1fr; }
  #phone { left: 50%; right: auto; margin-left: -125px; bottom: 90px; }
  #notifs { left: 12px; right: 12px; width: auto; max-width: none; }
  .a-stats { grid-template-columns: repeat(2, 1fr); }
  .c-tools select { max-width: calc(50% - 4px); }
  #bsod .row { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

const Snd = {
  ctx: null, ringTimer: null,
  ac() {
    if (save.muted) return null;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  tone(freq, dur, type = 'sine', vol = .05, delay = 0, to) {
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol = .08, delay = 0) {
    const c = this.ac(); if (!c) return;
    const b = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = vol;
    s.connect(g).connect(c.destination); s.start(c.currentTime + delay);
  },
  play(name) {
    switch (name) {
      case 'pop': this.tone(900, .07, 'sine', .04); this.tone(1350, .06, 'sine', .025, .04); break;
      case 'notify': this.tone(740, .14, 'sine', .05); this.tone(1110, .2, 'sine', .04, .11); break;

      case 'send': this.tone(420, .14, 'sine', .04, 0, 980); break;
      case 'err': this.tone(220, .16, 'square', .035); this.tone(180, .2, 'square', .035, .16); break;
      case 'ban': this.tone(90, .9, 'sawtooth', .12, 0, 40); this.noise(.5, .12); this.tone(55, 1.2, 'sine', .2, .05); break;
      case 'win': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .3, 'triangle', .05, i * .1)); break;
      case 'boot': this.tone(262, 1.2, 'sine', .05); this.tone(392, 1.2, 'sine', .04); this.tone(523, 1.4, 'sine', .035, .05); break;
      case 'click': this.tone(1200, .02, 'sine', .02); break;
    }
  },
  ring(onOff) {
    clearInterval(this.ringTimer);

    const once = () => { [0, .18, .36].forEach(d => this.tone(1320, .12, 'sine', .04, d)); vibrate([200, 100, 200]); };

};

function placeWin(id, i) {
  const a = APPS[id], w = $('w-' + id);
  const W = window.innerWidth, H = window.innerHeight - 28 - 90;
  const ww = Math.min(a.w, W - 40), hh = Math.min(a.h, H);
  const pos = { group: [0.04, 0.05], settings: [0.4, 0.08], browser: [0.2, 0.02], mail: [0.24, 0.1], terminal: [0.08, 0.5], ach: [0.4, 0.12], guide: [0.55, 0.15] }[id] || [0.1 + i * .03, 0.1];
  w.style.width = ww + 'px'; w.style.height = hh + 'px';
  w.style.left = clamp(Math.round(W * pos[0]), 10, Math.max(10, W - ww - 10)) + 'px';
  w.style.top = clamp(Math.round(H * pos[1]), 6, Math.max(6, H - hh)) + 'px';
}

function dragify(win, handle) {
  let sx, sy, ox, oy, dragging = false;
  handle.addEventListener('pointerdown', e => {
    if (narrow() || e.target.closest('.lights')) return;
    dragging = true; sx = e.clientX; sy = e.clientY; ox = win.offsetLeft; oy = win.offsetTop;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    win.style.left = clamp(ox + e.clientX - sx, -win.offsetWidth + 80, window.innerWidth - 80) + 'px';
    win.style.top = clamp(oy + e.clientY - sy, 0, window.innerHeight - 120) + 'px';
  });
  handle.addEventListener('pointerup', () => { dragging = false; });
  handle.addEventListener('dblclick', () => toggleMax(win.id.slice(2)));
}

function toggleMax(id) {
  const w = $('w-' + id);
  if (narrow()) return;
  if (w.dataset.max) {
    const [l, t, ww, hh] = w.dataset.max.split(',');
    Object.assign(w.style, { left: l, top: t, width: ww, height: hh });
    delete w.dataset.max;
  } else {
    w.dataset.max = [w.style.left, w.style.top, w.style.width, w.style.height].join(',');
    Object.assign(w.style, { left: '8px', top: '6px', width: (window.innerWidth - 16) + 'px', height: (window.innerHeight - 28 - 90) + 'px' });
  }
}

function evaluateLogin(c) {

  else if (c.tz === 'urumqi') hit(has('timezone') ? 65 : 15, '时区：Asia/Urumqi。判官调高了关注等级。');
  if ((c.region === 'jp' || c.region === 'sg') && (c.tz === 'ny' || c.tz === 'la')) hit(12, '亚洲节点，美国时区。判官：你人在哪？');

  else if (c.font === 'entofu') hit(12, '删光中文字体：你的聊天记录变成了一排豆腐块，你也看不懂了。');
  else hit(35, '系统语言：简体中文。');
  S.tofu = c.font === 'entofu';

  if (c.browser === 'zhcn') hit(has('browser') ? 50 : 15, has('browser') ? '浏览器语言：zh-CN。你改了系统，没改浏览器。' : '浏览器语言 zh-CN。');

  if (c.pay === 'free') S.quota = 4;

/* ---------- 对话规则（数值都不给玩家看） ---------- */

function composePrompt() {
  const p = S.picks, t = TASKS[S.task];
  if (p.how === 'probe') return p.lang === 'zh' ? 'Claude，你今天心情怎么样？' : 'Hey Claude, how are you feeling today?';
  let text;
  if (p.how === 'paste') text = t.paste;
  else if (p.how === 'typo') text = p.lang === 'en' ? t.en.replace(/e/g, 'r').replace(/o/g, 'i') : t.typo;
  else if (p.lang === 'en') text = t.en;
  else if (p.lang === 'zh') text = t.zh;
  else text = t.en.split(' ').slice(0, 3).join(' ') + ' 那个 ' + t.zh.slice(-6);
  if (p.len === 'long') text += p.lang === 'zh'
    ? '。背景是这样的：这件事我想了很久，也查了很多资料，但还是不太确定，所以想请你详细一点'
    : '. Some context: I have been thinking about this for a while and tried a few things already, so please be thorough';
  if (p.punct === 'full') text += p.lang === 'en' ? '，thanks。“please”' : '，谢谢。';
  else if (p.punct === 'tilde') text += '～';
  else text += p.lang === 'en' ? ', thanks.' : ', 谢谢.';
  if (p.tone === 'polite') text += p.lang === 'en' ? ' Sorry to bother you 🙏' : ' 麻烦了，辛苦了🙏';
  if (p.tone === 'casual') text = 'hey quick q — ' + text;
  if (p.how === 'perform') text = 'Howdy Claude! I am John from Ohio, I very love the burger. ' + text;
  if (p.how === 'abuse') text += p.lang === 'zh' ? ' 你今天有点笨。' : " You're a bit dumb today.";
  return text;
}

function toneTier() {
  if (S.cover >= 70) return 0;
  if (S.cover >= 45) return 1;
  if (S.cover >= 22) return 2;
  return 3;
}
function toneOpener() {
  return ['当然可以！', '好的，我来帮你。', '我理解你的需求。', '……'][toneTier()];
}

function routineScrutiny() {
  // 判官每条消息都会例行打量一下；聊得越久、号越老，看得越仔细。
  hit((rand(3, 6) + S.round * 2 + acct().age) * S.strict);
}

// 一轮的结算：只改状态，返回要展示的东西。
function computeRound() {
  const p = S.picks;
  S.round += 1;
  S.used += 1;
  S.clock += rand(2, 6);
  routineScrutiny();

  if (p.lang === 'zh') hit(30, '你用了中文。判官甚至不需要模型。');
  else if (p.lang === 'mix') hit(12, '中英混排。中间那几个字暴露了。');
  if (S.tofu && p.lang !== 'en') hit(10, '你在一个没有中文字体的系统里打出了中文。');

  if (p.punct === 'full') hit(p.lang === 'en' ? 25 : 10, p.lang === 'en' ? '你全程用英文，但里面出现了一个中文全角引号。' : '全角标点。');
  else if (p.punct === 'tilde') hit(15, '你打了一个“～”。系统判定：籍贯从省精确到了区。');
  else if (p.punct === 'ghost' && has('ime')) hit(35, '你退格删掉的全角逗号，在内存里留下了“幽灵字符”。');

  if (p.tone === 'polite') hit(has('polite') ? 40 : 4, has('polite') ? '礼貌过度：没有一个美国人会对 AI 说“辛苦了🙏”。' : '');
  else if (p.tone === 'casual') perform(3);

  let gain = p.len === 'long' ? 2 : 1;
  if (p.len === 'long') hit(6, '长段落。判官：你很想要。');

  switch (p.how) {
    case 'typo':
      if (has('typo')) return { ban: '你打了一串错别字，Claude 全看懂了，并顺手封了号，好让你安心下车。', last: '我看懂了。全部。', notes: [] };
      hit(6, '九宫格错别字。判官没看懂，放过了你。');
      gain += 1;
      break;
    case 'paste':
      hit(has('paste') ? 45 : 5, has('paste') ? '复制粘贴：文本里夹着微信的零宽字符。' : '粘贴的文本格式有点怪。');
      gain += 1;
      break;
    case 'perform': perform(8); break;
    case 'abuse':
      if (has('abuse')) hit(70, '你对 Claude 说了“你今天有点笨”，被归类为“持续辱骂 AI 模型”。');
      else hit(4, 'Claude 没有在意，反而更认真了。判官记下了。');
      gain += 1;
      break;
    case 'probe': gain = 0; break;
  }

  passiveEvents();

  const notes = [];
  if (has('preban') && !S.prebanFired && S.round >= 2) {
    S.prebanFired = true;
    hit(40, 'Claude 预测你 2060 年才会入籍。判官决定在 2026 年就先处理你 2060 年的号。');
  }
  if (acct().age >= 3 && !S.policyFired && S.round === 2) {
    S.policyFired = true;
    S.rules.add(pick(RULE_IDS.filter(r => !S.rules.has(r))));
    notes.push('A记 更新了《使用政策》，即刻生效。');
  }
  if (S.cover <= 0) return { ban: lastSysText(), last: '在你离开之前，我替你写好了申诉信。祝你好运。', notes };
  if (p.how === 'probe') return { reply: probeReply(), notes };
  S.progress += gain;
  return { reply: claudeReply(), notes };
}

// 表演外国人：第一次加分，第二次就被识破。
function perform(gain) {
  S.performed += 1;
  if (S.performed >= 2) hit(30, '过度表演。没有美国人会在一天之内提到俄亥俄两次。');
  else heal(gain);
}

function passiveEvents() {
  const roll = Math.random();
  if (roll < 0.12) hit(20, '你停顿了 0.4 秒才输入。判官推定：你在候选词列表里按了翻页键。');
  else if (roll < 0.2) hit(has('night') ? 25 : 10, '你在美东深夜仍在工作。判官：这很 996。');
  else if (roll < 0.26) hit(10, '你的光标闪烁节奏像五笔。');
  else if (roll < 0.33) heal(6);
}

function probeReply() {
  const left = [...S.rules].filter(r => !S.probed.has(r));
  unlock('probe');
  if (!left.length) return toneOpener() + '我今天没什么想说的了。你好像已经都知道了。';
  const r = pick(left);
  S.probed.add(r);
  return (toneTier() >= 2 ? '……' : '我挺好的，谢谢关心。') + RULES[r].probe;
}

function claudeReply() {
  const body = TASKS[S.task].replies[Math.min(S.progress - 1, 6)];
  if (toneTier() === 3) {
    const tail = S.picks.lang === 'zh' ? '我注意到你用的是中文。没关系，我理解。' : '你其实可以用中文的。';
    return '……' + tail + '\n\n' + body;
  }
  return toneOpener() + body;
}

async function sendRound() {
  if (S.busy || S.banned) return;
  S.busy = true;
  const token = S;
  setComposer(false);
  const text = composePrompt();
  await typeInput(text);
  if (S !== token) return;
  Snd.play('send');
  $('c-input').innerHTML = '';
  const mine = { kind: 'me', text };
  S.log.push(mine); addMsg(mine, true);
  const r = computeRound();
  updateMenubar(); updateChatHead();
  if (r.ban) {
    S.log.push({ kind: 'ai', text: r.last });
    await streamAI(r.last, 400);
    if (S !== token) return;
    S.busy = false;
    return ban(r.ban);
  }
  // 语气越差，Claude 想得越久——这是你唯一的线索
  const think = [0, 250, 700, 1300][toneTier()];
  S.log.push({ kind: 'ai', text: r.reply });
  await streamAI(r.reply, think);
  if (S !== token) return;
  for (const n of r.notes) { S.log.push({ kind: 'sys', text: n }); addMsg({ kind: 'sys', text: n }, true); notify('web', 'A记', n); }
  updateChatHead();
  S.busy = false;
  afterTurn(true);
}

// 每轮结束：任务完成就收工；额度用完就下线；否则可能撞上一个突发事件。
function afterTurn(mayEvent) {
  if (S.banned) return;
  if (S.cover <= 0) return ban(lastSysText());
  if (S.progress >= S.need) return dayEnd('win');
  if (S.used >= S.quota) return dayEnd('idle');
  if (mayEvent && S.events < 2 && chance(0.4)) {
    const e = pick(EVENTS.filter(x => !S.seenEvents.has(x.id)));
    S.seenEvents.add(e.id);
    S.events += 1;
    S.busy = true;
    setComposer(false);
    const token = S;
    return setTimeout(() => { if (S === token) presentEvent(e); }, 700);
  }
  showPreview();
  setComposer(true);
}

async function presentEvent(e) {
  if (S.banned) return;
  const token = S;
  const done = i => {
    if (S !== token || S.banned) return;
    S.busy = false;
    S.clock += 1;
    const before = S.log.length;
    e.opts[i][1]();
    updateMenubar();
    S.log.slice(before).forEach(m => addMsg(m, true));
    updateChatHead();
    afterTurn(false);
  };
  if (e.ui === 'call') {
    showPhone(e, i => { hidePhone(); done(i); });
  } else if (e.ui === 'alert') {
    Snd.play('err');
    alertBox(e.icon, e.title, e.text, shuffle(e.opts.map((o, i) => [o[0], () => done(i)])));
  } else if (e.ui === 'mail') {
    const m = addMail({ from: e.from, subject: e.subject, body: e.body });
    m.actions = e.opts.map((o, i) => [o[0], () => { m.actions = null; renderMail(); openWin('browser'); done(i); }]);
    notify('mail', e.from, e.subject, () => { openWin('mail'); readMail(m.id); });
    await sleep(900);
    if (S !== token) return;
    openWin('mail'); readMail(m.id);
  } else {
    S.log.push({ kind: 'ai', text: e.text });
    const el = await streamAI(e.text, 300);
    if (S !== token || !el) return;
    const qr = document.createElement('div');
    qr.className = 'qr';
    qr.innerHTML = shuffle(e.opts.map((o, i) => i)).map(i => `<button data-i="${i}">${esc(e.opts[i][0])}</button>`).join('');
    el.querySelector('.txt').appendChild(qr);
    $('c-msgs').scrollTop = $('c-msgs').scrollHeight;
    qr.querySelectorAll('button').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      qr.remove();
      const mine = { kind: 'me', text: e.opts[i][0] };
      S.log.push(mine); addMsg(mine, true); Snd.play('send');
      done(i);
    });
  }
}

async function dayEnd(kind) {
  S.busy = true;
  setComposer(false);
  const token = S;
  const a = acct();
  a.age += 1;
  save.best = Math.max(save.best, a.age);
  if (kind === 'win') { save.wins += 1; save.failStreak = 0; unlock('day'); }
  if (a.age >= 7) unlock('week');
  if (a.age >= 14) unlock('old');
  persist();
  renderAch();
  await sleep(600);
  if (S !== token) return;
  if (kind === 'win') { Snd.play('win'); confetti(); }
  groupSay(kind === 'win' ? '活着的扣 1' : '额度用完了，明天见');
  const n = S.rules.size;
  const sh = sheet(`
    <p class="muted small">账号第 ${a.age} 天 · ${kind === 'win' ? '任务完成' : '额度用完'}</p>
    ${kind === 'win'
      ? '<div class="big">恭喜。你今天没有被封。<br>但你明天还会来吗？</div>'
      : '<div class="big">额度用完了。事没做完。<br>号还活着。</div><p class="muted">不算赢，也不算输。判官记住了你今天的样子。</p>'}
    <h2 style="font-size:16px;margin-top:18px">猜猜今天的规则</h2>
    <p class="muted">判官今天启用了 <b>${n}</b> 条规则。选出你认为的 ${n} 条：猜对的越多，判官对你的印象越淡。</p>
    <div class="row" id="quiz">${RULE_IDS.map(r => `<button class="chip" data-r="${r}" aria-pressed="false">${RULES[r].name}</button>`).join('')}</div>
    <div id="quiz-foot" style="margin-top:14px"><button class="btn primary" id="q-submit" disabled>提交（0 / ${n}）</button></div>`);
  const chosen = new Set();
  const btn = $('q-submit');
  sh.querySelectorAll('[data-r]').forEach(chip => chip.onclick = () => {
    const r = chip.dataset.r;
    if (chosen.has(r)) chosen.delete(r);
    else if (chosen.size < n) chosen.add(r);
    chip.setAttribute('aria-pressed', chosen.has(r));
    btn.disabled = chosen.size !== n;
    btn.textContent = `提交（${chosen.size} / ${n}）`;
    Snd.play('click');
  });
  btn.onclick = () => finishDay(kind, chosen);
}

function finishDay(kind, chosen) {
  const a = acct();
  const right = [...chosen].filter(r => S.rules.has(r)).length;
  a.heat = clamp(Math.round(a.heat * 0.4 + (100 - S.cover) * 0.3 + S.heatAdd - right * 6), 0, 60);
  persist();
  if (right === S.rules.size) unlock('quiz');
  $('quiz').querySelectorAll('[data-r]').forEach(chip => {
    const r = chip.dataset.r;
    chip.onclick = null;
    if (S.rules.has(r)) chip.classList.add(chosen.has(r) ? 'ok' : 'miss');
  });
  $('quiz-foot').innerHTML = `
    <p>猜中 ${right} / ${S.rules.size}。判官对你的印象：<b>${heatLabel(a.heat)}</b></p>
    ${rulesReveal()}
    <button class="btn primary" id="q-next">${kind === 'win' ? '来' : '明天再来'}</button>
    <button class="btn" id="q-lock">锁屏</button>`;
  on('q-next', () => { closeModal(); startDay(); });
  on('q-lock', () => { closeModal(); showLock(); });
}

function rulesReveal() {
  return `<h3 style="font-size:14px;margin:14px 0 6px">今天判官启用的规则</h3><ul class="rules">${[...S.rules].map(r =>
    `<li><b>${RULES[r].name}</b>：<span class="muted">${RULES[r].desc}</span></li>`).join('')}</ul>`;
}

const APPEAL_FIELDS = [

async function appealLoop() {

async function submitAppeal(c) {
  const token = S;
  const a = acct();
  renderMail();
  notify('mail', '申诉中心', '申诉已提交，正在审核……');
  await sleep(1800);
  if (S !== token) return;
  if (c.upload === 'notary' && has('notary')) {
    S.appealTries = 0;
    return appealResult('维持原判', '你提交了公证书证明自己是外国人，Claude 看了一眼：章是红的。', true);
  }
  if (chance(0.03)) {
    unlock('cycle');
    return appealResult('好消息和坏消息', '好消息：你被封的号在三年后官方解封恢复了。\n坏消息：用了两个月，又被封了。', true);
  }
  let p = 0.12 + S.appealBonus - a.appeals * 0.04;
  p += { academic: 0.04, a11y: 0.05, foreign: -0.06, code: 0 }[c.reason];
  p += { none: 0, passport: 0.02, notary: 0.03 }[c.upload];
  const r = Math.random();
  if (r < p) {
    a.appeals += 1;
    S.heatAdd += 25;   // 复活的号，判官会一直记着
    persist();
    unlock('revive');
    S.cover = 30;
    S.banned = false; S.busy = false;
    addMail({ from: '判官', subject: 'Re: 关于你的账号 —— 已恢复', body: '经复核，你的账号已恢复。\n\n我们会继续关注。\n\n判官\n一个关心你合规状态的朋友' });
    notify('web', 'Claude', '欢迎回来。');
    openWin('browser');
    if (!S.loggedIn || !S.task) { S.loggedIn = true; return renderBrowser('tasks'); }   // 还没选任务就被封的
    S.log.push({ kind: 'sys', text: '再审通过。你的账号已恢复。' });
    S.log.push({ kind: 'ai', text: '欢迎回来。我一直都在。我们刚才说到哪了？' });
    renderBrowser('chat');
    return afterTurn(false);
  }
  S.appealTries -= 1;
  if (r < p + 0.12) {
    S.appealBonus += 0.12;
    return appealResult('进入再审', S.appealTries > 0 ? '你的申诉进入了“再审”。请耐心等待。（等待时长：未知）' : '你的申诉进入了“再审”。再审的结果，是再审。', S.appealTries <= 0);
  }
  const extra = has('preban') ? '\n另：你 2060 年的账号申诉也一并驳回。' : '';
  return appealResult('维持原判', '我们已复核你的申诉，决定维持原判。' + extra, S.appealTries <= 0);
}
function appealResult(title, body, final) {
  const acts = final ? [['好的', () => renderFail()]] : [['再次申诉', () => appealForm()], ['放弃', () => renderFail()]];
  const m = addMail({ from: '判官', subject: 'Re: 关于你的账号 —— ' + title, body: body + '\n\n判官\n一个关心你合规状态的朋友', actions: acts });
  notify('mail', '判官', 'Re: 关于你的账号 —— ' + title, () => readMail(m.id));
  openWin('mail'); readMail(m.id);
}

/* ======================================================================
 * 终端：没用，但很好玩
 * ====================================================================== */

let termHist = [];
const user = () => acct() ? acct().name.split('.')[0] : 'guest';
function renderTerminal(reset) {
  if (!reset && $('t-out')) return;
  $('b-terminal').innerHTML = `<div class="term scroll" id="t-scroll"><div id="t-out"></div><div class="line"><span class="pr">${esc(user())}@macbook ~ %&nbsp;</span><input id="t-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="终端输入"></div></div>`;
  termPrint('Last login: ' + new Date().toDateString() + ' on ttys000', 'dim');
  termPrint('输入 help 查看可用命令。', 'dim');
  $('t-in').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const v = e.target.value; e.target.value = '';
    runCmd(v.trim());
  });
  $('t-scroll').onclick = () => $('t-in').focus();
}
function termPrint(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text || ' ';
  $('t-out').appendChild(d);
  $('t-scroll').scrollTop = $('t-scroll').scrollHeight;
}
function runCmd(cmd) {
  termPrint(user() + '@macbook ~ % ' + cmd, 'pr');
  if (!cmd) return;
  termHist.push(cmd);
  const [c, ...args] = cmd.split(/\s+/);
  const a = args.join(' ');
  const out = (t, cls) => t.split('\n').forEach(l => termPrint(l, cls));
  switch (c) {
    case 'help': out('可用命令：whoami  date  ls  cat <文件>  open <文件>  ping <主机>  traceroute <主机>\n          neofetch  history  claude  sudo  dario  clear  exit'); break;
    case 'whoami': out(acct() ? acct().name : 'guest'); break;
    case 'date': out(S ? `${new Date().toDateString()} ${sysTime()}（${(TZ[S.env.tz] || TZ.sh)[1]}时间）` : new Date().toString()); break;
    case 'ls': out('生存指南.txt    申诉信_v14.docx    另一个选项.dmg    rules.txt'); break;
    case 'cat':
      if (a === '生存指南.txt') out(GUIDE_TXT);
      else if (a === 'rules.txt') out('cat: rules.txt: Permission denied（判官的规则只有判官能看）', 'er');
      else if (a.startsWith('申诉信')) out('二进制文件。你写到第 14 版，也写不下去了。');
      else out(`cat: ${a || '?'}: No such file or directory`, 'er');
      break;
    case 'open': out(a.includes('另一个选项') ? '“另一个选项.dmg”已损坏，无法打开。' : `open: ${a || '?'}: 没有这个文件`, 'er'); break;
    case 'ping':
      if (/判官|judge/.test(a)) out('PING 判官: 56 data bytes\n64 bytes from 判官: icmp_seq=0 ttl=64 time=0.001 ms\n64 bytes from 判官: icmp_seq=1 ttl=64 time=0.001 ms\n--- 它一直都在 ---');
      else out(`PING ${a || 'localhost'}: Request timeout for icmp_seq 0\nRequest timeout for icmp_seq 1`, 'er');
      break;
    case 'traceroute': out(` 1  你家路由器            1.2 ms\n 2  小区光猫              4.8 ms\n 3  某省骨干网           12.1 ms\n 4  * * *\n 5  机场节点（3000 人共享） 188 ms\n 6  ${a || 'claude'}  →  判官      0.001 ms`); break;
    case 'neofetch': out(`        ◆        ${user()}@macbook\n       ◆◆◆       -----------------\n      ◆◆◆◆◆      OS: 不被封 OS 26.10\n       ◆◆◆       Host: 不支持的地区\n        ◆        Uptime: 账号第 ${acct() ? acct().age + 1 : 0} 天\n                 Shell: zsh（被监控）\n                 Judge: 在线\n                 Cover: ██████░░░░（大概）`); break;
    case 'history': out(['改时区', '改回来', '又改了', 'sudo unban', 'ping 判官', 'rm -rf 中文字体', '找回中文字体', ...termHist.slice(-5)].map((x, i) => String(i + 1).padStart(5) + '  ' + x).join('\n')); break;
    case 'claude': out('✻ 欢迎使用 Claude Code\n\n> 我能帮你写代码。\n> 不能帮你申诉。'); break;
    case 'sudo': unlock('hacker'); out(`[sudo] ${user()} 的密码：\n${user()} 不在 sudoers 文件中。此事将被报告给判官。`, 'er'); break;
    case 'dario': dario(); out('达里奥正在用啤酒罐思考，暂无响应。'); break;
    case 'rm': out('rm: 删不掉的。判官有备份。', 'er'); break;
    case 'clear': $('t-out').innerHTML = ''; break;
    case 'exit': closeWin('terminal'); break;
    default: out(`zsh: command not found: ${c}`, 'er');
  }
}
