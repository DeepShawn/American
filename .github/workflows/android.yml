name: Build Android APK (arm64-v8a)

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - index.html
      - android/**
      - .github/workflows/android.yml
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '填写版本号（如 v1.0.0）则创建该标签并发布 Release；留空只构建'
        required: false
        default: ''

permissions:
  contents: write   # 推 v* 标签时创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME），缺的 platform/build-tools 由 AGP 自动补装
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::未配置 KEYSTORE_BASE64，APK 使用 debug 签名。"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('1.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/bubeifeng-arm64-v8a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bubeifeng-arm64-v8a
          path: android/dist/bubeifeng-arm64-v8a.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: 不被封的一天 ${{ inputs.release_tag || github.ref_name }}
          body: |
            - 网页版：https://deepshawn.github.io/American/
            - 安卓：`bubeifeng-arm64-v8a.apk`（arm64-v8a，Android 8.0+，离线可玩，不联网，只用到震动）
          files: android/dist/bubeifeng-arm64-v8a.apk
